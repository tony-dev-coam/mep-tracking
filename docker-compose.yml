services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mep
      POSTGRES_PASSWORD: mep
      POSTGRES_DB: mep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mep"]
      interval: 2s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://mep:mep@postgres:5432/mep
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - ./api:/srv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
