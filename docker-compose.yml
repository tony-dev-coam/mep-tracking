services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mep
      POSTGRES_PASSWORD: mep
      POSTGRES_DB: mep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mep"]
      interval: 2s
      retries: 30

  api:
    build: ./api
    # dev: reload on code changes (the bind mount below); the image CMD runs without --reload
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://mep:mep@postgres:5432/mep
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - ./api:/srv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24-slim
    working_dir: /app
    # node_modules lives in a container volume: vite/rolldown ship platform-specific binaries
    command: sh -c "npm ci && npm run dev -- --port 5173"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  web_node_modules:
